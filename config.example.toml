# Portable configuration template for transcribe and benchmark.
# Copy to config.local.toml and replace every /path/to value locally.

[transcribe]
input_dir = "./audio"
output_dir = "./output"
cuda_devices = "0"
model = "/path/to/models/faster-whisper-large-v3"
task = "transcribe"
language = "en"
output_format = "all"
device = "cuda"
compute_type = "float16"
batch_size = 16
max_speakers = ""
skip_transcribe_existing = false
diarize = false
docker_image = "whisperx:torch280-cu128"
docker_pull_policy = "missing"
docker_cache = "/path/to/cache/whisperx-batch"
recursive = false

[librispeech]
root = "/path/to/datasets/LibriSpeech"
subset = "dev-clean"
url = "https://www.openslr.org/resources/12/dev-clean.tar.gz"
archive = "dev-clean.tar.gz"
convert_to_wav = false
convert_num_proc = 8
ffmpeg_threads = 0
keep_archive = true
convert_if_missing_only = false

[benchmark]
dataset = "/path/to/datasets/LibriSpeech/dev-clean"
transcribe = "transcribe"
ext = "flac"
output_root = "./benchmark-output"
output_format = "json"
score_format = "json"
max_files = 0
batch_size = 16
skip_transcribe_existing = false
no_diarize = true
transcribe_config = "config.local.toml"
results_csv = ""
limit = 0

[whisper]
align_model = "WAV2VEC2_ASR_BASE_960H"
interpolate_method = "nearest"
no_align = false
return_char_alignments = false
vad_method = ""
vad_onset = ""
vad_offset = ""
chunk_size = ""
min_speakers = ""
diarize_model = "/path/to/models/pyannote/speaker-diarization-community-1"
speaker_embeddings = false
temperature = 0
best_of = 1
beam_size = 1
patience = 1.0
length_penalty = 1.0
suppress_tokens = "-1"
suppress_numerals = false
initial_prompt = ""
condition_on_previous_text = true
fp16 = true
temperature_increment_on_fallback = 0.2
compression_ratio_threshold = 2.4
logprob_threshold = -1.0
no_speech_threshold = 0.6
max_line_width = 0
max_line_count = 0
highlight_words = false
segment_resolution = "sentence"
threads = 0
print_progress = "false"
